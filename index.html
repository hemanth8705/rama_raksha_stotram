<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Śrī Rāma Rakṣā Stotram — Meaning</title>


<style>


:root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #29231d;
    --muted: #756b60;
    --accent: #8b4513;
    --accent-light: #f3e4d2;
    --border: #e2d7ca;
    --sanskrit-bg: #fff9ef;
    --meaning-bg: #f7f7f5;
    --understanding-bg: #fffaf5;
    --button-bg: #ffffff;
    --table-bg: #ffffff;
    --sticky-bg: rgba(250,247,242,.96);
    --simple-border: #c9a77c;
    --detail-border: #a98c70;
    --on-accent: #ffffff;
}

:root[data-theme="dark"] {
    --bg: #17130f;
    --card: #221c16;
    --text: #ece4da;
    --muted: #a99d8f;
    --accent: #e0a064;
    --accent-light: #3a2c1f;
    --border: #4a3d31;
    --sanskrit-bg: #2b231a;
    --meaning-bg: #2a241e;
    --understanding-bg: #292119;
    --button-bg: #2b241d;
    --table-bg: #221c16;
    --sticky-bg: rgba(23,19,15,.96);
    --simple-border: #7d6342;
    --detail-border: #6e5a46;
    --on-accent: #1b140d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);

    font-family:
        "Noto Sans",
        "Noto Sans Telugu",
        "Noto Serif Telugu",
        Georgia,
        serif;

    line-height: 1.75;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 30px 18px 70px;
}

/* -------------------------------------------------
   HEADER
------------------------------------------------- */

header {
    text-align: center;
    padding: 35px 20px 25px;
}

h1 {
    margin: 0;
    color: var(--accent);
    font-size: clamp(28px, 5vw, 46px);
}

.subtitle {
    color: var(--muted);
    font-size: 17px;
    margin-top: 10px;
}

/* -------------------------------------------------
   GLOBAL CONTROLS
------------------------------------------------- */

.global-controls {
    position: sticky;
    top: 0;

    z-index: 20;

    background: var(--sticky-bg);
    backdrop-filter: blur(8px);

    padding: 12px 0;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: 1px solid var(--border);

    background: var(--button-bg);
    color: var(--text);

    border-radius: 9px;

    padding: 9px 14px;

    cursor: pointer;

    font-size: 14px;

    transition: .15s ease;
}

button:hover {
    background: var(--accent-light);
}

button.active {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
}

/* -------------------------------------------------
   VERSE CARD
------------------------------------------------- */

.verse {
    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 16px;

    margin: 18px 0;

    overflow: hidden;
}

/* -------------------------------------------------
   VERSE HEADER
------------------------------------------------- */

.verse-header {
    padding: 15px 20px;

    background: var(--accent-light);

    display: flex;
    align-items: center;

    gap: 12px;
}

.verse-number {
    font-weight: bold;
    color: var(--accent);
    font-size: 18px;

    white-space: nowrap;
}

/* -------------------------------------------------
   ORIGINAL
------------------------------------------------- */

.original-section {
    padding: 20px;
}

.section-title {
    color: var(--accent);

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;
}

.sanskrit {
    background: var(--sanskrit-bg);

    border-left: 4px solid var(--accent);

    border-radius: 8px;

    padding: 16px 18px;

    font-size: 21px;

    line-height: 2;

    margin-bottom: 15px;
}

/* -------------------------------------------------
   INLINE MEANINGS (inside the Original box)
   Switched per verse with classes on the .verse card:
     .inline-words-on   word-by-word under every word
     .inline-simple-on  simple meaning under every line
------------------------------------------------- */

.inline-line {
    display: none;
}

.verse.inline-words-on .sanskrit.has-inline .plain-line {
    display: none;
}

.verse.inline-words-on .sanskrit.has-inline .inline-line {
    display: flex;
}

.inline-line {
    flex-wrap: wrap;
    align-items: flex-start;

    gap: 4px 20px;
}

.inline-line.blank {
    min-height: 1em;
}

.inline-unit {
    display: inline-flex;
    flex-direction: column;

    max-width: 12em;
}

.inline-word {
    line-height: 1.6;
}

.inline-meaning {
    color: var(--muted);

    font-size: 13px;
    font-weight: normal;
    line-height: 1.4;
}

.line-block {
    margin-bottom: 6px;
}

.line-simple {
    display: none;

    color: var(--muted);

    font-size: 16px;
    line-height: 1.6;

    margin-top: 2px;
    margin-bottom: 4px;
}

.verse.inline-simple-on .line-simple {
    display: block;
}

.verse-buttons .inline-button {
    border-color: var(--simple-border);
}

/* -------------------------------------------------
   VERSE TOGGLE BUTTONS
------------------------------------------------- */

.verse-buttons {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    padding: 0 20px 20px;
}

.verse-buttons button {
    font-size: 14px;
}

.verse-buttons .simple-button {
    border-color: var(--simple-border);
}

.verse-buttons .detail-button {
    border-color: var(--detail-border);
}

/* -------------------------------------------------
   TOGGLEABLE CONTENT
------------------------------------------------- */

.toggle-section {
    display: none;

    padding: 0 20px 20px;
}

.toggle-section.visible {
    display: block;
}

/* -------------------------------------------------
   SIMPLE MEANING
------------------------------------------------- */

.simple-meaning {
    background: var(--meaning-bg);

    border-radius: 10px;

    padding: 16px 18px;

    font-size: 18px;
}

/* -------------------------------------------------
   UNDERSTANDING
------------------------------------------------- */

.understanding {
    background: var(--understanding-bg);

    border-radius: 10px;

    padding: 16px 18px;

    border: 1px solid var(--border);

    margin-bottom: 20px;
}

/* -------------------------------------------------
   WORD TABLE
------------------------------------------------- */

.word-table {
    width: 100%;

    border-collapse: collapse;

    margin: 10px 0 0;

    background: var(--table-bg);
}

.word-table th,
.word-table td {
    border: 1px solid var(--border);

    padding: 10px 12px;

    vertical-align: top;

    text-align: left;
}

.word-table th {
    background: var(--accent-light);

    color: var(--accent);
}

.sanskrit-word {
    font-weight: bold;

    font-size: 18px;
}

/* -------------------------------------------------
   FOOTER
------------------------------------------------- */

footer {
    text-align: center;

    color: var(--muted);

    padding: 40px 10px;
}

/* -------------------------------------------------
   MOBILE
------------------------------------------------- */

@media (max-width: 650px) {

    .sanskrit {
        font-size: 18px;
    }

    .inline-unit {
        max-width: 9em;
    }

    .inline-line {
        gap: 4px 14px;
    }

    .word-table,
    .word-table thead,
    .word-table tbody,
    .word-table th,
    .word-table td,
    .word-table tr {
        display: block;
    }

    .word-table thead {
        display: none;
    }

    .word-table tr {
        border: 1px solid var(--border);

        margin-bottom: 10px;

        border-radius: 8px;

        overflow: hidden;
    }

    .word-table td {
        border: none;

        border-bottom: 1px solid var(--border);
    }

    .word-table td:last-child {
        border-bottom: none;
    }
}


</style>
</head>


<body>

<div class="theme-bar">
    <button id="theme-toggle" class="theme-toggle" type="button"></button>
</div>

<div class="container">

<header>

    <h1 id="page-heading"></h1>

    <div class="subtitle" id="page-subtitle"></div>

</header>


<div class="global-controls">

    <button id="btn-toggle-simple" onclick="toggleAllSimple()"></button>

    <button id="btn-toggle-detailed" onclick="toggleAllDetailed()"></button>

    <button id="btn-inline-simple" onclick="toggleInlineSimple()"></button>

    <button id="btn-inline-words" onclick="toggleInlineWords()"></button>

</div>


<div id="verses"></div>


<footer id="page-footer"></footer>

</div>


<script>

/*
=========================================================
  All page content (verses, meanings, labels, header and
  footer text) lives in rama_raksha_stotram.json.
  This script only loads that file and renders the page.

  NOTE: browsers block fetch() on file:// pages. Serve the
  folder over HTTP, e.g.  python -m http.server
=========================================================
*/

const DATA_URL = "rama_raksha_stotram.json";

let verses = [];
let ui = {};


/*
=========================================================
  THEME (DARK / LIGHT)
=========================================================
*/

function getInitialTheme() {

    try {
        const saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") return saved;
    } catch (e) {}

    return window.matchMedia &&
           window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
}

function applyTheme(theme) {

    document.documentElement.setAttribute("data-theme", theme);

    const toggle = document.getElementById("theme-toggle");

    /* Button offers the mode you can switch TO. */
    toggle.textContent = theme === "dark"
        ? "☀ " + (ui.lightMode || "Light Mode")
        : "🌙 " + (ui.darkMode || "Dark Mode");

    try { localStorage.setItem("theme", theme); } catch (e) {}
}

function toggleTheme() {

    const current = document.documentElement.getAttribute("data-theme");

    applyTheme(current === "dark" ? "light" : "dark");
}

applyTheme(getInitialTheme());

document.getElementById("theme-toggle")
    .addEventListener("click", toggleTheme);


/*
=========================================================
  LOAD DATA
=========================================================
*/

async function loadData() {

    try {

        const response = await fetch(DATA_URL);

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();

        ui = data.ui || {};
        verses = data.verses || [];

        renderPage(data.meta || {});

    } catch (error) {

        const box = document.getElementById("verses");

        box.innerHTML = '<div class="load-error"></div>';

        box.firstChild.textContent =
            "Could not load " + DATA_URL + " (" + error.message + "). " +
            "Open this page through a web server instead of file://.";
    }
}

function renderPage(meta) {

    if (meta.pageTitle) document.title = meta.pageTitle;

    document.getElementById("page-heading").textContent = meta.heading || "";

    document.getElementById("page-subtitle").textContent = meta.subtitle || "";


    document.getElementById("page-footer").innerHTML =
        (meta.footer || []).map(line => "<div>" + line + "</div>").join("");

    applyTheme(document.documentElement.getAttribute("data-theme"));

    renderVerses();

    updateGlobalButtons();
}


/*
=========================================================
  RENDER VERSES
=========================================================
*/

function renderVerses() {

    const container = document.getElementById("verses");

    container.innerHTML = "";

    verses.forEach(verse => {

        const hasSimple = !!verse.simple;

        const hasDetail = !!verse.deep || !!(verse.words && verse.words.length);

        const verseCard = document.createElement("article");

        verseCard.className = "verse";

        /*
         * VERSE HEADER
         */

        const header = document.createElement("div");

        header.className = "verse-header";

        header.innerHTML = `

            <span class="verse-number">
                ${
                    typeof verse.number === "number"
                    ? ui.verseLabel + " " + verse.number
                    : verse.number
                }
            </span>

        `;


        /*
         * ORIGINAL SECTION
         */

        const originalSection = document.createElement("div");

        originalSection.className = "original-section";

        const hasInline = !!(verse.inline && verse.inline.length);

        const hasInlineSimple = !!(verse.inlineSimple && verse.inlineSimple.length);

        originalSection.innerHTML = `

            <div class="section-title">
                ${ui.originalTitle}
            </div>

            <div class="sanskrit${hasInline ? " has-inline" : ""}">

                ${

                    verse.text.split("\n").map((line, i) => `

                        <div class="line-block">

                            <div class="plain-line">${line || "&nbsp;"}</div>

                            ${hasInline ? createInlineLine(verse.inline[i] || []) : ""}

                            ${hasInlineSimple && verse.inlineSimple[i]
                                ? `<div class="line-simple">${verse.inlineSimple[i]}</div>`
                                : ""}

                        </div>

                    `).join("")

                }

            </div>

        `;

        verseCard.appendChild(header);

        verseCard.appendChild(originalSection);


        /*
         * TWO BUTTONS + TOGGLE SECTIONS
         * (only created for the parts the verse has data for)
         */

        const buttons = document.createElement("div");

        buttons.className = "verse-buttons";

        let simpleSection = null;
        let detailSection = null;

        if (hasSimple) {

            const simpleButton = document.createElement("button");

            simpleButton.className = "simple-button";

            simpleButton.textContent = ui.showSimple;

            simpleSection = document.createElement("div");

            simpleSection.className = "toggle-section simple-section";

            simpleSection.innerHTML = `

                <div class="section-title">
                    ${ui.simpleTitle}
                </div>

                <div class="simple-meaning">
                    ${verse.simple}
                </div>

            `;

            simpleButton.addEventListener("click", () => {

                setSimple(simpleSection, simpleButton,
                    !simpleSection.classList.contains("visible"));

            });

            buttons.appendChild(simpleButton);
        }

        if (hasDetail) {

            const detailButton = document.createElement("button");

            detailButton.className = "detail-button";

            detailButton.textContent = ui.showDetail;

            detailSection = document.createElement("div");

            detailSection.className = "toggle-section detail-section";

            /*
             * Order is: Understanding, then Word-by-Word
             */

            detailSection.innerHTML =

                (verse.deep ? `

                    <div class="section-title">
                        ${ui.understandingTitle}
                    </div>

                    <div class="understanding">
                        ${verse.deep}
                    </div>

                ` : "") +

                (verse.words && verse.words.length ? `

                    <div class="section-title">
                        ${ui.wordsTitle}
                    </div>

                    ${createWordTable(verse.words)}

                ` : "");

            detailButton.addEventListener("click", () => {

                setDetail(detailSection, detailButton,
                    !detailSection.classList.contains("visible"));

            });

            buttons.appendChild(detailButton);
        }

        if (hasInlineSimple) {

            const inlineSimpleButton = document.createElement("button");

            inlineSimpleButton.className = "inline-button inline-simple-button";

            inlineSimpleButton.textContent = ui.showInlineSimple;

            inlineSimpleButton.addEventListener("click", () => {

                setInline(verseCard, "inline-simple-on", inlineSimpleButton,
                    !verseCard.classList.contains("inline-simple-on"),
                    ui.showInlineSimple, ui.hideInlineSimple);

            });

            buttons.appendChild(inlineSimpleButton);
        }

        if (hasInline) {

            const inlineWordsButton = document.createElement("button");

            inlineWordsButton.className = "inline-button inline-words-button";

            inlineWordsButton.textContent = ui.showInlineWords;

            inlineWordsButton.addEventListener("click", () => {

                setInline(verseCard, "inline-words-on", inlineWordsButton,
                    !verseCard.classList.contains("inline-words-on"),
                    ui.showInlineWords, ui.hideInlineWords);

            });

            buttons.appendChild(inlineWordsButton);
        }

        if (buttons.children.length) verseCard.appendChild(buttons);

        if (simpleSection) verseCard.appendChild(simpleSection);

        if (detailSection) verseCard.appendChild(detailSection);

        container.appendChild(verseCard);

    });

}


/*
=========================================================
  CREATE WORD TABLE
=========================================================
*/

function createWordTable(words) {

    return `

        <table class="word-table">

            <thead>

                <tr>
                    <th>${ui.wordColumn}</th>
                    <th>${ui.meaningColumn}</th>
                </tr>

            </thead>

            <tbody>

                ${

                    words.map(word => `

                        <tr>

                            <td>
                                <span class="sanskrit-word">
                                    ${word.word}
                                </span>
                            </td>

                            <td>
                                ${word.meaning}
                            </td>

                        </tr>

                    `).join("")

                }

            </tbody>

        </table>

    `;
}


/*
=========================================================
  INLINE WORD-BY-WORD (shown inside the Original box)
=========================================================
*/

function createInlineLine(units) {

    if (!units.length) return '<div class="inline-line blank"></div>';

    return `<div class="inline-line">${

        units.map(unit => `

            <span class="inline-unit">
                <span class="inline-word">${unit.t}</span>
                ${unit.m
                    ? `<span class="inline-meaning">${unit.m}</span>`
                    : ""}
            </span>

        `).join("")

    }</div>`;
}


/*
=========================================================
  SHOW / HIDE (single verse and all verses)
=========================================================
*/

function setSimple(section, button, show) {

    section.classList.toggle("visible", show);

    button.textContent = show ? ui.hideSimple : ui.showSimple;

    button.classList.toggle("active", show);

    updateGlobalButtons();
}

function setDetail(section, button, show) {

    section.classList.toggle("visible", show);

    button.textContent = show ? ui.hideDetail : ui.showDetail;

    button.classList.toggle("active", show);

    updateGlobalButtons();
}

function setAllSimple(show) {

    document.querySelectorAll(".verse").forEach(verse => {

        const section = verse.querySelector(".simple-section");

        const button = verse.querySelector(".simple-button");

        if (section && button) setSimple(section, button, show);

    });
}

function setAllDetailed(show) {

    document.querySelectorAll(".verse").forEach(verse => {

        const section = verse.querySelector(".detail-section");

        const button = verse.querySelector(".detail-button");

        if (section && button) setDetail(section, button, show);

    });
}

/*
 * Global toggles: if every verse already shows the section, hide
 * them all; otherwise show them all.
 */

function allVisible(selector) {

    const sections = document.querySelectorAll(selector);

    return sections.length > 0 &&
        Array.from(sections).every(s => s.classList.contains("visible"));
}

function toggleAllSimple() {

    setAllSimple(!allVisible(".simple-section"));
}

function toggleAllDetailed() {

    setAllDetailed(!allVisible(".detail-section"));
}

/*
 * Inline toggles work per verse (the buttons inside each card) and
 * globally (the buttons at the top, which drive every verse).
 */

function setInline(verseCard, className, button, show, showText, hideText) {

    verseCard.classList.toggle(className, show);

    button.textContent = show ? hideText : showText;

    button.classList.toggle("active", show);

    updateGlobalButtons();
}

function allInline(buttonSelector, className) {

    const buttons = document.querySelectorAll(buttonSelector);

    return buttons.length > 0 &&
        Array.from(buttons).every(b =>
            b.closest(".verse").classList.contains(className));
}

function setAllInline(buttonSelector, className, show, showText, hideText) {

    document.querySelectorAll(buttonSelector).forEach(button => {

        setInline(button.closest(".verse"), className, button, show,
            showText, hideText);

    });
}

function toggleInlineSimple() {

    setAllInline(".inline-simple-button", "inline-simple-on",
        !allInline(".inline-simple-button", "inline-simple-on"),
        ui.showInlineSimple, ui.hideInlineSimple);
}

function toggleInlineWords() {

    setAllInline(".inline-words-button", "inline-words-on",
        !allInline(".inline-words-button", "inline-words-on"),
        ui.showInlineWords, ui.hideInlineWords);
}

function updateGlobalButtons() {

    const simpleAll = allVisible(".simple-section");
    const detailAll = allVisible(".detail-section");
    const inlineSimple = allInline(".inline-simple-button", "inline-simple-on");
    const inlineWords = allInline(".inline-words-button", "inline-words-on");

    const set = (id, on, onText, offText) => {

        const button = document.getElementById(id);

        button.textContent = on ? onText : offText;

        button.classList.toggle("active", on);
    };

    set("btn-toggle-simple", simpleAll, ui.hideAllSimple, ui.showAllSimple);
    set("btn-toggle-detailed", detailAll, ui.hideAllDetailed, ui.showAllDetailed);
    set("btn-inline-simple", inlineSimple, ui.hideInlineSimple, ui.showInlineSimple);
    set("btn-inline-words", inlineWords, ui.hideInlineWords, ui.showInlineWords);
}


/*
=========================================================
  INITIALIZE PAGE
=========================================================
*/

loadData();

</script>

</body>
</html>
